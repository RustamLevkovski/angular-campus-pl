<section class="content-page-wrapper">
  <h1>Angular Campus: Web Development</h1>
  <p>
    General web development topics live here. Navigate sections via the left menu or create your own.
  </p>

  <button mat-raised-button color="primary" type="button" class="mb-4" (click)="showForm = !showForm">
    {{ showForm ? 'Cancel' : 'Add new section' }}
  </button>

  @if (showForm) {
  <app-dynamic-section-form (sectionCreated)="onSectionCreated($event)">
  </app-dynamic-section-form>
  }

  <app-section-view [sections]="sections" (update)="updateSection($event)" (remove)="removeSection($event)"></app-section-view>
</section>
