<div class="content-layout">
  <app-top-navbar class="content-layout__top"></app-top-navbar>

  <div class="content-layout__body">
    <app-left-side-menu class="content-layout__side"></app-left-side-menu>

    <main class="content-layout__main">
      @if (sections$ | async; as allSections) {
        <!-- Remove this and add the router-outlet here -->
        <app-angular-page [sections]="getSectionsByPage(allSections, 'angular')"></app-angular-page>
        <app-js-page [sections]="getSectionsByPage(allSections, 'javascript')"></app-js-page>
        <app-common-webdev-page [sections]="getSectionsByPage(allSections, 'webdev')"></app-common-webdev-page>
      }
    </main>

  </div>
</div>
